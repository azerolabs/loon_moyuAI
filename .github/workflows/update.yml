name: Update Loon AI rules

on:
  schedule:
    - cron: "17 0 * * *" # 08:17 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert upstream rules
        run: python update_ai_loon.py
      - name: Commit changes
        run: |
          if git diff --quiet -- AI-Loon.list; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI-Loon.list
          git commit -m "Update AI rules"
          git push

